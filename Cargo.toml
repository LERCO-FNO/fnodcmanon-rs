[package]
name = "fnodcmanon"
version = "0.1.0"
edition = "2024"
authors = ["Vojtěch Benda"]

[workspace]
members = [".", "generate-tag-rules"]

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
csv = "1.4.0"
dicom-core = "0.9.0"
dicom-dictionary-std = "0.9.0"
dicom-object = "0.9.0"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
uuid = { version = "1.21.0", features = ["v7"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "fmt"] }
snafu = "0.9.2"
